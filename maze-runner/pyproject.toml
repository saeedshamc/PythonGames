[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-runner"
version = "1.0.0"
description = "A 2D maze game built with Python and Pygame"
requires-python = ">=3.8"
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.24.0",
]

[project.scripts]
maze-runner = "maze_runner.main:main"

[tool.setuptools.packages.find]
where = ["src"]
